status = error
name = TestLog4j2Config

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p [%c{1}:%L] %m%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = console

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn

logger.jettyServer.name = org.sparkproject.jetty.server
logger.jettyServer.level = warn

logger.akka.name = akka
logger.akka.level = warn

logger.remoting.name = Remoting
logger.remoting.level = warn
